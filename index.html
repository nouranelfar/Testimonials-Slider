<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <meta name="description" content="Bootcamp Testimonials Slider">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Coding Bootcamp Testimonials Slider</title>
</head>
<body>
  <main>
    <div class="imgContainer">
      <img class="bgImg" src="./assets/images/pattern-bg.svg" alt="pattern bg" loading="eager" fetchpriority="high">
      <img class="userImg" src="" alt="Tanya Sinclair">
      <div class="arrowsContainer">
        <button class="prevBtn" aria-label="prev button"><img src="./assets/images/icon-prev.svg" alt="prev"></button>
        <button class="nextBtn" aria-label="next button"><img src="./assets/images/icon-next.svg" alt="next"></button>
      </div>
    </div>

    <div class="personDetails">
      <p class="userParagraph"></p>

      <div class="moreDetails">
        <h1 class="userName"></h1>
        <span class="userJob"></span>
      </div>
    </div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
